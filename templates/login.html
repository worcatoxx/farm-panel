<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в систему — FarmBot Sniper PRO</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg">
    <link rel="apple-touch-icon" href="/app-icon.svg">
    <meta name="theme-color" id="meta-theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FarmBot">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --spring-gentle: cubic-bezier(0.25, 1.35, 0.5, 1);
            --bg-main: #09090b;
            --bg-card: #111115;
            --bg-card-hover: #18181f;
            --bg-sub: #09090b;
            --bg-glass: rgba(9, 9, 11, 0.85);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --accent: #7c3aed;
            --accent-hover: #8b5cf6;
            --accent-glow: rgba(124, 58, 237, 0.28);
        }
        [data-theme="amoled-blue"] {
            --bg-main: #000000;
            --bg-card: #090A0F;
            --bg-card-hover: #121521;
            --bg-sub: #050608;
            --bg-glass: rgba(9, 10, 15, 0.85);
            --text-main: #FFFFFF;
            --text-muted: #7E8B9B;
            --border: #1A2035;
            --accent: #2563EB;
            --accent-hover: #3B82F6;
            --accent-glow: rgba(37, 99, 235, 0.3);
        }
        [data-theme="dark-blue"] {
            --bg-main: #0B0F17;
            --bg-card: #131B2E;
            --bg-card-hover: #1B2640;
            --bg-sub: #0E1422;
            --bg-glass: rgba(19, 27, 46, 0.85);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border: #233252;
            --accent: #38BDF8;
            --accent-hover: #7DD3FC;
            --accent-glow: rgba(56, 189, 248, 0.25);
        }
        [data-theme="full-blue"] {
            --bg-main: #04152D;
            --bg-card: #072247;
            --bg-card-hover: #0B2E5E;
            --bg-sub: #051B38;
            --bg-glass: rgba(7, 34, 71, 0.85);
            --text-main: #E2F1FF;
            --text-muted: #7FA6CC;
            --border: #123E7A;
            --accent: #00F2FE;
            --accent-hover: #4FACFE;
            --accent-glow: rgba(0, 242, 254, 0.25);
        }
        [data-theme="amoled-emerald"] {
            --bg-main: #000000;
            --bg-card: #070D0A;
            --bg-card-hover: #0E1A14;
            --bg-sub: #040806;
            --bg-glass: rgba(7, 13, 10, 0.85);
            --text-main: #ECFDF5;
            --text-muted: #6EE7B7;
            --border: #143325;
            --accent: #10B981;
            --accent-hover: #34D399;
            --accent-glow: rgba(16, 185, 129, 0.25);
        }
        [data-theme="sunset-dark"] {
            --bg-main: #0F0A0C;
            --bg-card: #1A1115;
            --bg-card-hover: #26181F;
            --bg-sub: #120C0E;
            --bg-glass: rgba(26, 17, 21, 0.85);
            --text-main: #FFF5F5;
            --text-muted: #A3858E;
            --border: #331F28;
            --accent: #F97316;
            --accent-hover: #FB923C;
            --accent-glow: rgba(249, 115, 22, 0.25);
        }
        [data-theme="light-tech"] {
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F1F5F9;
            --bg-sub: #F1F5F9;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-glow: rgba(37, 99, 235, 0.15);
        }
        [data-theme="warm-craft"] {
            --bg-main: #EAE6DF;
            --bg-card: #F4F1EA;
            --bg-card-hover: #FAF8F5;
            --bg-sub: #E4DFD7;
            --bg-glass: rgba(244, 241, 234, 0.88);
            --text-main: #1C1B18;
            --text-muted: #78736A;
            --border: #D6D0C4;
            --accent: #FF4F00;
            --accent-hover: #E04600;
            --accent-glow: rgba(255, 79, 0, 0.15);
        }

        @keyframes pixelSpringIn {
            0% { opacity: 0; transform: translateY(24px) scale(0.94); }
            65% { opacity: 1; transform: translateY(-3px) scale(1.015); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--bg-main);
            background-image: radial-gradient(700px circle at 50% 0%, var(--accent-glow), transparent 70%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.35s ease, color 0.35s ease;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(20px);
            animation: pixelSpringIn 0.55s var(--spring-gentle) both;
        }
        .input-field {
            background-color: var(--bg-sub) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            transition: all 0.28s var(--spring-gentle);
        }
        .input-field:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px var(--accent-glow) !important;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--accent) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            box-shadow: 0 8px 20px -4px var(--accent-glow);
            transition: transform 0.4s var(--spring-bounce), background-color 0.2s ease, box-shadow 0.25s ease;
        }
        .btn-primary:hover {
            background: var(--accent-hover) !important;
            transform: translateY(-2px) scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.94);
        }
        .theme-dot-btn {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: transform 0.4s var(--spring-bounce), border-radius 0.35s var(--spring-bounce), border-color 0.2s ease;
        }
        .theme-dot-btn:hover {
            transform: scale(1.15);
        }
        .theme-dot-btn:active {
            transform: scale(0.88);
        }
        .theme-dot-btn.active {
            transform: scale(1.22);
            border-radius: 9px;
            border-color: var(--text-main);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md">
        <!-- Компактный переключатель тем на странице входа -->
        <div class="flex items-center justify-center gap-2 mb-4 py-2 px-3 rounded-full" style="background: var(--bg-card); border: 1px solid var(--border); animation: pixelSpringIn 0.45s var(--spring-gentle) both;">
            <span class="text-[11px] font-medium mr-1" style="color: var(--text-muted);">Тема:</span>
            <button type="button" onclick="applyTheme('default-violet')" data-t="default-violet" class="theme-dot-btn" style="background:#7c3aed;" title="Фирменная PRO"></button>
            <button type="button" onclick="applyTheme('amoled-blue')" data-t="amoled-blue" class="theme-dot-btn" style="background:#2563EB;" title="AMOLED Синий"></button>
            <button type="button" onclick="applyTheme('dark-blue')" data-t="dark-blue" class="theme-dot-btn" style="background:#38BDF8;" title="Тёмный Кобальт"></button>
            <button type="button" onclick="applyTheme('full-blue')" data-t="full-blue" class="theme-dot-btn" style="background:#00F2FE;" title="Глубокий Синий"></button>
            <button type="button" onclick="applyTheme('amoled-emerald')" data-t="amoled-emerald" class="theme-dot-btn" style="background:#10B981;" title="AMOLED Изумруд"></button>
            <button type="button" onclick="applyTheme('sunset-dark')" data-t="sunset-dark" class="theme-dot-btn" style="background:#F97316;" title="Ночной Закат"></button>
            <button type="button" onclick="applyTheme('light-tech')" data-t="light-tech" class="theme-dot-btn" style="background:#F8FAFC; border-color:#94A3B8;" title="Светлая Техно"></button>
            <button type="button" onclick="applyTheme('warm-craft')" data-t="warm-craft" class="theme-dot-btn" style="background:#EAE6DF; border-color:#FF4F00;" title="Песочная"></button>
        </div>

        <div class="login-card p-8 sm:p-9 rounded-3xl relative overflow-hidden">
            <div class="text-center mb-7">
                <div class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center text-white shadow-lg transition-transform duration-300 hover:scale-110 hover:rotate-3" style="background: var(--accent); box-shadow: 0 10px 25px -5px var(--accent-glow);">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-mono font-medium mb-2.5" style="background: var(--bg-sub); border: 1px solid var(--border); color: var(--accent);">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    FARMBOT SNIPER PRO v3.9
                </div>
                <h1 class="text-xl font-bold tracking-tight">Вход в панель управления</h1>
                <p class="text-xs mt-1" style="color: var(--text-muted);">Автоматизированная система перехвата и вывода ваучеров</p>
            </div>

            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 px-4 py-3 rounded-2xl text-xs mb-5 flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-medium block mb-1.5" style="color: var(--text-muted);">Логин администратора</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2" style="color: var(--text-muted);">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input name="username" placeholder="admin" required autofocus class="input-field w-full rounded-2xl pl-10 pr-4 py-3 text-xs outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium block mb-1.5" style="color: var(--text-muted);">Пароль доступа</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2" style="color: var(--text-muted);">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input id="login-pwd" name="password" type="password" placeholder="••••••••" required class="input-field w-full rounded-2xl pl-10 pr-10 py-3 text-xs outline-none">
                        <button type="button" onclick="toggleLoginPwd()" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 transition" style="color: var(--text-muted);" title="Показать/скрыть пароль">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary mt-2 w-full py-3.5 rounded-2xl font-semibold text-xs flex items-center justify-center gap-2 cursor-pointer">
                    <span>Войти в панель</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>

            <div class="mt-7 pt-4 flex items-center justify-between text-[11px] font-mono" style="border-top: 1px solid var(--border); color: var(--text-muted);">
                <span>FarmBot Sniper PRO v3.9 by wcatox</span>
                <span class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                    Защищено
                </span>
            </div>
        </div>
    </div>

    <script>
        function toggleLoginPwd() {
            const p = document.getElementById('login-pwd');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        function applyTheme(theme) {
            if (theme === 'default-violet') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('farm_theme', theme);
            document.querySelectorAll('.theme-dot-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-t') === theme);
            });
        }

        applyTheme(localStorage.getItem('farm_theme') || 'default-violet');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
