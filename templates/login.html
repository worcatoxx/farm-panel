<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель — FarmBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .ambient-glow {
            background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.16), transparent 55%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08), transparent 50%);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased ambient-glow selection:bg-brand-600 selection:text-white">

    <div class="w-full max-w-sm">
        <div class="p-8 rounded-3xl bg-zinc-900/60 border border-zinc-800/80 backdrop-blur-xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-brand-500/25">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <h1 class="text-lg font-bold tracking-tight text-white">Вход в FarmBot</h1>
                <p class="text-xs text-zinc-400 mt-1">Management Console</p>
            </div>

            {% if error %}
            <div class="bg-rose-500/15 border border-rose-500/30 text-rose-400 px-3 py-2.5 rounded-xl text-xs mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" class="flex flex-col gap-3.5">
                <div>
                    <label class="text-[11px] font-medium text-zinc-400 block mb-1.5">Логин администратора</label>
                    <input name="username" placeholder="admin" required autofocus class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-zinc-600 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-zinc-400 block mb-1.5">Пароль</label>
                    <input name="password" type="password" placeholder="••••••••" required class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-zinc-600 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition">
                </div>
                <button type="submit" class="mt-2 w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs shadow-md shadow-brand-600/25 transition active:scale-95">
                    Войти в консоль
                </button>
            </form>

            <div class="mt-6 text-center text-[10px] text-zinc-600 font-mono">
                by wcatox &bull; farm-panel v2.4
            </div>
        </div>
    </div>

</body>
</html>
