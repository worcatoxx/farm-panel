<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — FarmBot Sniper</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg">
    <link rel="apple-touch-icon" href="/pwa-icon.svg">
    <meta name="theme-color" content="#141415">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FarmBot">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                if (localStorage.getItem('farm_ui_theme') === 'carbon-signal') {
                    document.documentElement.setAttribute('data-theme', 'carbon-signal');
                    const mc = document.querySelector('meta[name="theme-color"]');
                    if (mc) mc.setAttribute('content', '#0d0e11');
                }
                if (localStorage.getItem('farm_motion_mode') === 'turbo') {
                    document.documentElement.setAttribute('data-motion', 'turbo');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg-sidebar: #0f0f10;
            --bg-page: #141415;
            --bg-card: #19191b;
            --bg-raised: #232325;
            --border: rgba(237, 237, 237, 0.08);
            --border-hover: rgba(237, 237, 237, 0.16);
            --text-primary: #ededed;
            --text-secondary: #a1a1a6;
            --text-muted: #85858b;
            --accent: #3b82f6;
            --accent-ring: rgba(59, 130, 246, 0.25);
            --positive: #4cc38a;
            --negative: #e5484d;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --dur-fast: 150ms;
            --dur-med: 240ms;
        }

        :root[data-motion="turbo"] {
            --dur-fast: 90ms;
            --dur-med: 145ms;
        }

        html[data-theme="carbon-signal"] {
            --bg-sidebar: #090a0c;
            --bg-page: #0d0e11;
            --bg-card: #131519;
            --bg-raised: #1a1d24;
            --border: rgba(244, 241, 234, 0.09);
            --border-hover: rgba(234, 126, 30, 0.34);
            --text-primary: #f4f1ea;
            --text-secondary: #aba9a0;
            --text-muted: #91908a;
            --accent: #ea7e1e;
            --accent-ring: rgba(234, 126, 30, 0.28);
            --positive: #3fd88f;
            --negative: #f05252;
        }

        html[data-theme="carbon-signal"] body {
            background-image: radial-gradient(rgba(244, 241, 234, 0.055) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
        }

        html[data-theme="carbon-signal"] .surface-card {
            box-shadow: inset 0 1px 0 rgba(244, 241, 234, 0.055), 0 14px 36px rgba(0, 0, 0, 0.4);
        }

        html[data-theme="carbon-signal"] .btn-primary {
            box-shadow: inset 0 1px 0 #ffffff, 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        html[data-theme="carbon-signal"] .text-\[\#ededed\] { color: var(--text-primary); }
        html[data-theme="carbon-signal"] .text-\[\#a1a1a6\] { color: var(--text-secondary); }
        html[data-theme="carbon-signal"] .text-\[\#85858b\] { color: var(--text-muted); }
        html[data-theme="carbon-signal"] .bg-\[\#232325\] { background-color: var(--bg-raised); }
        html[data-theme="carbon-signal"] .bg-\[\#0f0f10\] { background-color: var(--bg-sidebar); }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-block-size: 100dvh;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .surface-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            animation: cardEnter 280ms var(--ease) both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-input {
            background-color: var(--bg-raised);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
        }

        .field-input::placeholder {
            color: var(--text-muted);
        }

        .field-input:hover {
            border-color: var(--border-hover);
        }

        .field-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .btn-primary {
            background-color: var(--text-primary);
            color: var(--bg-sidebar);
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 150ms var(--ease), transform 120ms var(--ease), opacity 150ms var(--ease);
        }

        .btn-primary:hover {
            background-color: #ffffff;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-raised);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            background-color: #2a2a2d;
        }

        :where(a, button, input):focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .field-input:focus-visible {
            outline: none;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

        .error-shake {
            animation: shakeError 320ms var(--ease) both;
        }

        dialog.console-dialog {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0;
            max-width: 480px;
            width: calc(100% - 32px);
            margin: auto;
            opacity: 0;
            transform: scale(0.94) translateY(8px);
            transition-property: opacity, transform, display, overlay;
            transition-duration: var(--dur-med);
            transition-timing-function: var(--ease);
            transition-behavior: allow-discrete;
        }
        dialog.console-dialog[open]:where(:not([data-closing])) {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        dialog.console-dialog::backdrop {
            background-color: rgba(9, 9, 11, 0);
            backdrop-filter: blur(0px);
            transition-property: background-color, backdrop-filter, display, overlay;
            transition-duration: var(--dur-med);
            transition-timing-function: var(--ease);
            transition-behavior: allow-discrete;
        }
        dialog.console-dialog[open]:where(:not([data-closing]))::backdrop {
            background-color: rgba(9, 9, 11, 0.78);
            backdrop-filter: blur(4px);
        }

        @starting-style {
            dialog.console-dialog[open]:where(:not([data-closing])) {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            dialog.console-dialog[open]:where(:not([data-closing]))::backdrop {
                background-color: rgba(9, 9, 11, 0);
                backdrop-filter: blur(0px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --dur-fast: 80ms;
                --dur-med: 100ms;
            }
            .surface-card,
            .error-shake {
                animation: none !important;
            }
            dialog.console-dialog,
            dialog.console-dialog[open]:where(:not([data-closing])) {
                transform: none !important;
            }
            .btn-primary:active {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="w-full max-w-[400px]">
        <section class="surface-card p-6 sm:p-8" aria-labelledby="login-title">
            <div class="flex items-center justify-between gap-3 mb-6">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-9 h-9 rounded-[10px] bg-[#232325] border border-white/10 flex items-center justify-center shrink-0 text-[#ededed]">
                        <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <div class="text-sm font-semibold tracking-tight text-[#ededed] truncate">FarmBot Sniper</div>
                        <div class="text-xs text-[#85858b] truncate">Консоль управления фермой</div>
                    </div>
                </div>
                <button
                    type="button"
                    id="version-badge"
                    onclick="triggerEasterEgg()"
                    class="font-mono text-xs text-[#a1a1a6] bg-[#232325] border border-white/10 px-2.5 py-1 rounded-[6px] shrink-0 cursor-pointer hover:text-[#ededed] hover:border-white/20 transition-colors"
                    aria-label="Версия 5.0"
                >v5.0</button>
            </div>

            <div class="mb-6">
                <h1 id="login-title" class="text-xl font-medium text-[#ededed] tracking-tight">Вход в панель</h1>
                <p class="text-[13px] text-[#a1a1a6] mt-1">Авторизуйтесь для доступа к юзерботам, Xray-слотам и RapidOCR</p>
            </div>

            {% if error %}
            <div role="alert" class="error-shake bg-[#e5484d]/10 border border-[#e5484d]/30 text-[#e5484d] px-3.5 py-2.5 rounded-[8px] text-[13px] mb-5 flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form id="login-form" method="post" onsubmit="handleFormSubmit(event)" class="flex flex-col gap-4">
                <div>
                    <label for="login-username" class="text-[13px] font-medium text-[#a1a1a6] block mb-1.5">Логин администратора</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#85858b] pointer-events-none">
                            <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                            </svg>
                        </span>
                        <input
                            id="login-username"
                            name="username"
                            placeholder="admin"
                            autocomplete="username"
                            required
                            autofocus
                            class="field-input w-full pl-9 pr-3 py-2.5 text-sm"
                        >
                    </div>
                </div>

                <div>
                    <label for="login-pwd" class="text-[13px] font-medium text-[#a1a1a6] block mb-1.5">Пароль</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#85858b] pointer-events-none">
                            <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                            </svg>
                        </span>
                        <input
                            id="login-pwd"
                            name="password"
                            type="password"
                            placeholder="Введите пароль"
                            autocomplete="current-password"
                            required
                            class="field-input w-full pl-9 pr-10 py-2.5 text-sm"
                        >
                        <button
                            type="button"
                            onclick="toggleLoginPwd()"
                            aria-label="Показать или скрыть пароль"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-[6px] text-[#85858b] hover:text-[#ededed] hover:bg-white/5 transition-colors cursor-pointer"
                        >
                            <svg id="eye-icon" class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button id="submit-btn" type="submit" class="btn-primary mt-1 w-full h-10 px-4 text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <span id="btn-text">Войти</span>
                    <svg id="btn-arrow" class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                    </svg>
                    <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" aria-hidden="true" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </button>
            </form>

            <footer class="mt-6 pt-4 border-t border-white/[0.08] flex items-center justify-between text-xs font-mono text-[#85858b]">
                <span>FarmBot Sniper v5.0 by wcatox</span>
                <span class="inline-flex items-center gap-1.5 text-[#a1a1a6]">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#4cc38a]"></span>
                    <span>Сессия защищена</span>
                </span>
            </footer>
        </section>
    </main>

    <!-- Пасхалка: открывается по 5 кликам на v5.0, закрывается только по крестику -->
    <dialog id="easter-egg-modal" class="console-dialog" aria-labelledby="easter-egg-title">
        <div class="p-5 sm:p-6 text-center relative">
            <button
                type="button"
                onclick="closeEasterEgg()"
                aria-label="Закрыть окно"
                class="btn-secondary absolute top-4 right-4 w-8 h-8 flex items-center justify-center cursor-pointer"
            >
                <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <h2 id="easter-egg-title" class="text-base font-medium text-[#ededed] mb-1">Саня одобрил</h2>
            <p class="text-xs text-[#85858b] mb-4">Пасхалка FarmBot Sniper v5.0</p>
            <div class="rounded-[12px] overflow-hidden border border-white/[0.08] bg-[#0f0f10] flex items-center justify-center max-h-[60vh] mb-4">
                <img
                    id="easter-egg-img"
                    src="https://iili.io/nO1Fuzg.png"
                    onerror="this.onerror=null; this.src='/static/img/sanya_ok.webp';"
                    alt="Саня одобрил"
                    class="w-full h-auto max-h-[55vh] object-contain"
                >
            </div>
            <a
                href="https://iili.io/nO1Fuzg.png"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-secondary inline-flex items-center justify-center gap-2 h-9 px-4 text-xs font-medium text-[#ededed]"
            >
                <span>Открыть оригинал</span>
                <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
                </svg>
            </a>
        </div>
    </dialog>

    <script>
        function toggleLoginPwd() {
            const input = document.getElementById('login-pwd');
            const eye = document.getElementById('eye-icon');
            if (!input || !eye) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            const path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path1.setAttribute('stroke-linecap', 'round');
            path1.setAttribute('stroke-linejoin', 'round');
            if (isHidden) {
                path1.setAttribute('d', 'M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88');
                eye.replaceChildren(path1);
            } else {
                path1.setAttribute('d', 'M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z');
                const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path2.setAttribute('stroke-linecap', 'round');
                path2.setAttribute('stroke-linejoin', 'round');
                path2.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z');
                eye.replaceChildren(path1, path2);
            }
        }

        function handleFormSubmit() {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('btn-text');
            const arrow = document.getElementById('btn-arrow');
            const spinner = document.getElementById('btn-spinner');
            if (text) text.textContent = 'Выполняется вход';
            if (arrow) arrow.classList.add('hidden');
            if (spinner) spinner.classList.remove('hidden');
            if (btn) {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.8';
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        let _easterEggClicks = 0;
        let _easterEggTimer = null;
        let _lastEasterEggOpenedAt = 0;

        function triggerEasterEgg() {
            _easterEggClicks++;
            if (_easterEggTimer) clearTimeout(_easterEggTimer);
            const badge = document.getElementById('version-badge');
            if (badge) {
                badge.style.transform = 'scale(0.94)';
                setTimeout(() => { badge.style.transform = ''; }, 120);
            }
            if (_easterEggClicks >= 5) {
                _easterEggClicks = 0;
                showEasterEggModal();
            } else {
                _easterEggTimer = setTimeout(() => { _easterEggClicks = 0; }, 2200);
            }
        }

        let _supportsDisplayTransition;
        function canTransitionDisplay() {
            if (_supportsDisplayTransition !== undefined) return _supportsDisplayTransition;
            if (!window.CSS?.supports?.('transition-behavior', 'allow-discrete') || !document.body) {
                return false;
            }
            const probe = document.createElement('div');
            probe.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
            document.body.appendChild(probe);
            getComputedStyle(probe).display;
            probe.style.display = 'none';
            _supportsDisplayTransition = getComputedStyle(probe).display === 'block';
            probe.remove();
            return _supportsDisplayTransition;
        }

        function supportsTopLayerExit() {
            return window.CSS?.supports?.('overlay', 'auto') && canTransitionDisplay();
        }

        function showEasterEggModal() {
            const modal = document.getElementById('easter-egg-modal');
            if (!modal) return;
            modal.removeAttribute('data-closing');
            _lastEasterEggOpenedAt = Date.now();
            if (typeof modal.showModal === 'function') {
                if (!modal.open) modal.showModal();
            } else {
                modal.setAttribute('open', '');
            }
        }

        async function closeEasterEgg() {
            if (Date.now() - _lastEasterEggOpenedAt < 350) return;
            const modal = document.getElementById('easter-egg-modal');
            if (!modal) return;
            if (!supportsTopLayerExit()) {
                modal.setAttribute('data-closing', '');
                const anims = typeof modal.getAnimations === 'function' ? modal.getAnimations({ subtree: true }) : [];
                if (anims.length > 0) {
                    await Promise.race([
                        Promise.allSettled(anims.map(a => a.finished)),
                        new Promise(r => setTimeout(r, 340)),
                    ]);
                }
                if (!modal.hasAttribute('data-closing')) return;
                modal.removeAttribute('data-closing');
            }
            if (typeof modal.close === 'function') {
                modal.close();
            } else {
                modal.removeAttribute('open');
            }
        }

        const _eeModal = document.getElementById('easter-egg-modal');
        if (_eeModal) {
            _eeModal.addEventListener('cancel', (e) => {
                e.preventDefault();
            });
        }
    </script>
</body>
</html>
